# Actions 안에서 Dockerfile로 이미지를 만들고, 커밋 번호를 태그로 붙여 Artifact Registry에 올린 뒤 그 이미지로 배포한다.
# 사용법: deploy-envs.yml 의 deploy 작업을 이 파일의 내용으로 바꾼다(테스트, 환경, 승인 구조는 그대로).
#   저장소 공통 Variables 에 AR_REPO(예: us-central1-docker.pkg.dev/<프로젝트 ID>/friend-agent) 를 추가한다.
#   배포용 서비스 계정에 Artifact Registry 저장소 하나에 대한 쓰기 권한(roles/artifactregistry.writer)을 추가한다(docs/wif-setup.md 5단계).
# 배포용 이미지는 여기서만 만든다. 노트북에서 만든 이미지는 CPU 종류가 다를 수 있고, 누가 언제 만들었는지 기록이 남지 않는다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGING_SERVICE: friend-agent-staging
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # 1. staging 브랜치에서만 이미지를 만들고, 이미지 이름과 커밋을 다음 단계로 넘긴다
      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name != 'main'
        run: |
          IMAGE="${{ vars.AR_REPO }}/friend-agent:${{ github.sha }}"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      # 2. main 브랜치에서는 이미지를 만들지 않고, staging 리비전의 다이제스트와 커밋을 찾는다
      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REV=$(gcloud run services describe "$STAGING_SERVICE" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          gcloud run revisions describe "$REV" --region us-central1 --format json > rev.json
          echo "IMAGE=$(jq -r '.status.imageDigest' rev.json)" >> "$GITHUB_ENV"
          echo "COMMIT=$(jq -r '.spec.containers[0].env[] | select(.name=="COMMIT_SHA") | .value' rev.json)" >> "$GITHUB_ENV"
          echo "staging 리비전 $REV 의 이미지를 승격한다"

      # 3. 새 리비전을 트래픽 0%로 올리고 candidate 태그를 붙인다 (블루그린의 green). 사용자는 아직 이전 리비전을 쓴다.
      #    태그 이름은 서비스 안에서 하나뿐이라, 다음 배포 때 candidate 는 이전 리비전에서 떨어져 새 리비전으로 옮겨 간다.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
          no_traffic: true
          tag: candidate
          env_vars: |
            COMMIT_SHA=${{ env.COMMIT }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }} --startup-probe=httpGet.path=/health,periodSeconds=5,failureThreshold=12,timeoutSeconds=2

      - name: 배포 결과
        run: |
          echo "배포된 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $IMAGE"

      # 4. 스모크 테스트: 서비스 주소는 아직 이전 리비전이 답하므로, 새 리비전에만 닿는 태그 URL로 확인한다.
      #    /health 가 200이고 /version 의 commit 이 이번 커밋과 같아야 통과. 콜드 스타트를 감안해 5초 간격으로 최대 12번 묻는다.
      #    끝까지 실패하면 exit 1 로 이 단계가 실패하고, 아래 전환 단계는 실행되지 않는다.
      - name: 스모크 테스트 (태그 URL)
        run: |
          URL=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "확인할 태그 URL $URL"
          for i in $(seq 1 12); do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL/health" || true)
            GOT=$(curl -s --max-time 5 "$URL/version" | jq -r '.commit // empty' || true)
            echo "시도 $i: /health $HEALTH, commit ${GOT:0:12} (기대 ${COMMIT:0:12})"
            if [ "$HEALTH" = "200" ] && [ "$GOT" = "$COMMIT" ]; then
              echo "스모크 테스트 통과"
              exit 0
            fi
            sleep 5
          done
          echo "스모크 테스트 실패: 전환하지 않는다. 사용자는 계속 이전 리비전을 쓴다."
          exit 1

      # 5. 카나리: 지금 트래픽을 받는 리비전(롤백할 곳)과 새 리비전 이름을 남기고, 새 리비전에 10% → 50% 를 보낸다.
      #    단계마다 2분 동안 scripts/canary_check.py 가 서비스 주소로 직접 요청을 보내 실패율과 느린 쪽 응답 시간(p95)을 잰다.
      #    기준을 넘으면 이전 리비전으로 100% 되돌리고 워크플로를 실패로 끝낸다(전환 단계로 가지 않음).
      - name: 카나리 10% → 50% (자동 판단)
        run: |
          SVC_JSON=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json)
          OLD=$(echo "$SVC_JSON" | jq -r '.status.traffic | max_by(.percent // 0) | .revisionName')
          NEW=$(echo "$SVC_JSON" | jq -r '.status.traffic[] | select(.tag=="candidate") | .revisionName')
          URL=$(echo "$SVC_JSON" | jq -r '.status.url')
          echo "이전 리비전 (롤백할 곳) $OLD / 새 리비전 $NEW"
          echo "### 카나리: 이전 리비전 (롤백할 곳) \`$OLD\` → 새 리비전 \`$NEW\`" >> "$GITHUB_STEP_SUMMARY"
          for P in 10 50; do
            gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --to-revisions "$NEW=$P,$OLD=$((100 - P))"
            echo "#### 새 리비전 $P%" >> "$GITHUB_STEP_SUMMARY"
            if ! python3 scripts/canary_check.py "$URL" "$NEW" "$OLD" --seconds 120; then
              echo "기준을 넘어 이전 리비전 $OLD 로 되돌린다"
              gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --to-revisions "$OLD=100"
              echo "**롤백: $P% 단계에서 기준을 넘어 \`$OLD\` 로 100% 되돌림**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      # 6. 전환: 카나리를 통과하면 가장 최근 리비전으로 100% 옮긴다.
      #    --to-latest 로 옮겨야 트래픽이 특정 리비전·태그에 묶이지 않는다(묶이면 다음 수동 배포가 0%로 남는다).
      - name: 전환 100%
        run: |
          gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --to-latest
          curl -s "$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format 'value(status.url)')/version"

      # 7. 배포가 끝나면 서비스, 커밋, 리비전, 다이제스트를 실행 요약(job summary)에 표로 남긴다 (연결표 자동 기록)
      - name: 배포 기록 남기기
        run: |
          REV=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          DIGEST=$(gcloud run revisions describe "$REV" --region us-central1 --format "value(status.imageDigest)")
          {
            echo "### 배포 기록 (${{ vars.ENV }})"
            echo ""
            echo "| 서비스 | 커밋 | 리비전 | 이미지 다이제스트 |"
            echo "|---|---|---|---|"
            echo "| ${{ vars.SERVICE }} | \`${COMMIT:0:12}\` | \`$REV\` | \`${DIGEST##*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
